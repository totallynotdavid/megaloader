[project]
name = "megaloader-cli"
version = "0.2.2"
description = "Command-line interface for Megaloader"
readme = "readme.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" },
]

dependencies = [
    "megaloader>=0.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "requests>=2.34.2",
]

[tool.uv.sources]
megaloader = { workspace = true }

[project.scripts]
megaloader = "megaloader_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.hatch.build.targets.sdist]
include = ["/megaloader_cli", "/readme.md"]

[tool.hatch.build.targets.wheel]
packages = ["megaloader_cli"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
files = ["megaloader_cli"]
strict = true
