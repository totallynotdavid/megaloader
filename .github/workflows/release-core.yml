name: release-core

on:
  push:
    tags: ["vcore-*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Upload steps and jobs run only on tag pushes. Everything else also runs on
# pull requests and manual runs as a dry run of the release.
jobs:
  preflight:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that every environment the workflow names exists
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: .github/workflows/release-core.yml
        run: |
          for NAME in $(yq '.jobs[].environment | select(. != null) | (.name // .)' "$WORKFLOW"); do
            if ! gh api "repos/$GITHUB_REPOSITORY/environments/$NAME" --silent; then
              echo "::error::Environment '$NAME' named by $WORKFLOW does not exist in $GITHUB_REPOSITORY"
              exit 1
            fi
            echo "Environment '$NAME' exists"
          done

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: mise run install

      - name: Check version and notes
        run: |
          PKG_VERSION=$(grep '^version = ' packages/core/pyproject.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/vcore-}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag $TAG_VERSION != core package $PKG_VERSION"
              exit 1
            fi
          fi
          MODULE_VERSION=$(grep '^__version__ = ' packages/core/megaloader/_version.py | cut -d'"' -f2)
          if [ "$PKG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Core package $PKG_VERSION != megaloader.__version__ $MODULE_VERSION"
            exit 1
          fi
          EXPECTED="megaloader $PKG_VERSION is out."
          FIRST_LINE=$(head -n 1 .github/release-notes-core.md | tr -d '\r')
          if [ "$FIRST_LINE" != "$EXPECTED" ]; then
            echo "First line of .github/release-notes-core.md is '$FIRST_LINE', expected '$EXPECTED'"
            exit 1
          fi

      - run: mise run build:core
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-dist
          path: dist/*

  pypi-core:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preflight, build]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/megaloader

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true

  github:
    needs: [preflight, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-dist
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          body_path: .github/release-notes-core.md
          generate_release_notes: true
