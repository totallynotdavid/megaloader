name: release-core

on:
  push:
    tags: ["vcore-*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
      - run: mise run install

      - run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/vcore-}"
          CORE_PKG_VERSION=$(grep '^version = ' packages/core/pyproject.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CORE_PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != core package $CORE_PKG_VERSION"
            exit 1
          fi
          CORE_MODULE_VERSION=$(grep '^__version__ = ' packages/core/megaloader/_version.py | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CORE_MODULE_VERSION" ]; then
            echo "Tag $TAG_VERSION != megaloader.__version__ $CORE_MODULE_VERSION"
            exit 1
          fi

      - run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/vcore-}"
          EXPECTED="megaloader $TAG_VERSION is out."
          FIRST_LINE=$(head -n 1 .github/release-notes-core.md | tr -d '\r')
          if [ "$FIRST_LINE" != "$EXPECTED" ]; then
            echo "First line of .github/release-notes-core.md is '$FIRST_LINE', expected '$EXPECTED'"
            exit 1
          fi

      - run: mise run build:core

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-dist
          path: dist/*

  pypi-core:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/megaloader

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true
