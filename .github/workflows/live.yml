name: live drift check

on:
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
      - run: mise run install

      - name: Re-fetch fixtures and check for drift
        run: mise run test:live
        env:
          GEONODE_USERNAME: ${{ secrets.GEONODE_USERNAME }}
          GEONODE_PASSWORD: ${{ secrets.GEONODE_PASSWORD }}
          GEONODE_HOST: ${{ secrets.GEONODE_HOST }}
          GEONODE_PORT_RANGE: ${{ secrets.GEONODE_PORT_RANGE }}
          PIXIV_PHPSESSID: ${{ secrets.PIXIV_PHPSESSID }}
