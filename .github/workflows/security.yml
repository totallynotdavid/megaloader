name: security report

on:
  push:
    branches: ["master"]
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
  workflow_dispatch:

jobs:
  security_checks:
    runs-on: ubuntu-latest
    name: PyCharm security scan
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tonybaloney/pycharm-security@5c1ceeb1fb2a18478fa7076a81f9f47fd450e592 # v1.29.0
        with:
          path: .
          fail_on_warnings: "no"
