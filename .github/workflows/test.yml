name: tests

# Offline gate: unit tests plus the cassette replay suite. Deterministic, no
# network, no credentials, so it runs on every push and PR. --block-network
# makes a stale or missing cassette fail loudly instead of reaching live sites.
# Live drift detection lives in live.yml (scheduled, allowed to fail).

on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "packages/core/**/*.py"
      - "packages/core/pyproject.toml"
      - "packages/core/tests/**"
  pull_request:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "packages/core/**/*.py"
      - "packages/core/pyproject.toml"
      - "packages/core/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Overrides the tracked .python-version for every uv command in the job.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --package megaloader

      - name: Check interpreter
        run: |
          uv run python -c "import sys; print(sys.version)"
          uv run python -c "import sys; v = '${{ matrix.python-version }}'.split('.'); assert sys.version_info[:2] == (int(v[0]), int(v[1])), sys.version"

      - name: Run tests
        run:
          uv run pytest --block-network -v --tb=short --junitxml=junit.xml -o
          junit_family=legacy

      - name: Coverage & codecov (3.13 only)
        if: matrix.python-version == '3.13'
        run: |
          uv run --with pytest-cov pytest \
            --block-network \
            --cov=megaloader \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./junit.xml
          report_type: test_results
