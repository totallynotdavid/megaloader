[settings]
python.uv_venv_auto = "source"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tools]
python = "3.15.2"
uv = "0.13.6"
ruff = "0.17.3"
bun = "1.4.4"

[tasks.install]
description = "Install dependencies from the lockfiles"
run = [
  "uv sync --locked --all-packages --extra dev",
  "cd apps/api && env -u VIRTUAL_ENV uv sync --locked --extra dev",
  "cd apps/docs && bun install --frozen-lockfile",
]

[tasks.update]
description = "Update all dependencies"
alias = "u"
run = [
  "uv lock --upgrade",
  "uv sync --locked --all-packages --extra dev",
]

[tasks.outdated]
description = "List outdated dependencies"
run = "uv pip list --outdated"

[tasks.lint]
description = "Check Python, JavaScript, TypeScript, and documentation formatting"
run = [
  "uv run --all-packages --extra dev ruff check --no-fix packages scripts",
  "uv run --all-packages --extra dev ruff format --check packages scripts",
  "cd apps/api && env -u VIRTUAL_ENV uv run ruff check --no-fix .",
  "cd apps/api && env -u VIRTUAL_ENV uv run ruff format --check .",
  "cd apps/docs && bunx oxlint --deny-warnings .",
  "cd apps/docs && bunx oxfmt --check .",
  "apps/docs/node_modules/.bin/oxfmt -c apps/docs/.oxfmtrc.json --check AGENTS.md readme.md docs .github apps/api/readme.md apps/docs packages/cli/readme.md packages/core/readme.md packages/core/sample/readme.md scripts/readme.md",
]

[tasks.fix]
description = "Apply safe lint and formatting fixes"
run = [
  "uv run --all-packages --extra dev ruff check --fix packages scripts",
  "uv run --all-packages --extra dev ruff format packages scripts",
  "cd apps/api && env -u VIRTUAL_ENV uv run ruff check --fix .",
  "cd apps/api && env -u VIRTUAL_ENV uv run ruff format .",
  "cd apps/docs && bunx oxlint --fix .",
  "cd apps/docs && bunx oxfmt .",
  "apps/docs/node_modules/.bin/oxfmt -c apps/docs/.oxfmtrc.json AGENTS.md readme.md docs .github apps/api/readme.md apps/docs packages/cli/readme.md packages/core/readme.md packages/core/sample/readme.md scripts/readme.md",
]

[tasks.typecheck]
description = "Run strict mypy checks for every Python package"
run = [
  "uv run --all-packages --extra dev mypy --strict packages/core/megaloader packages/cli/megaloader_cli",
  "cd apps/api && env -u VIRTUAL_ENV uv run mypy --strict api index.py",
]

[tasks.check]
description = "Run all read-only checks"
depends = ["lint", "typecheck", "test", "test:api", "build", "validate-snippets"]

[tasks.test]
description = "Run the offline core, CLI, and script test suite"
run = "uv run --all-packages --extra dev pytest --block-network packages/core/tests packages/cli/tests scripts/script_tests"

[tasks."test:api"]
description = "Run the API test suite"
run = "env -u VIRTUAL_ENV uv run pytest --strict-markers"
dir = "apps/api"

[tasks."build:core"]
description = "Build the core Python package"
run = "uv build --package megaloader"

[tasks."build:cli"]
description = "Build the CLI Python package"
run = "uv build --package megaloader-cli"

[tasks."build:docs"]
description = "Build the VitePress documentation site"
run = "env -u VIRTUAL_ENV bun run docs:build"
dir = "apps/docs"

[tasks.build]
description = "Build the packages and documentation site"
depends = ["build:core", "build:cli", "build:docs"]

[tasks.test-record]
description = "Re-fetch every plugin fixture through the proxy, refresh cassettes + snapshots"
run = "uv run --all-packages --extra dev pytest -vv -rA --log-cli-level=INFO packages/core/tests/plugins --record-mode=rewrite --snapshot-update"

[tasks."test:live"]
description = "Re-fetch plugin fixtures and compare snapshots without updating them"
run = "uv run --all-packages --extra dev pytest -vv -rA --log-cli-level=INFO packages/core/tests/plugins --record-mode=rewrite"

[tasks.proxy-probe]
description = "Make an ad-hoc request through the rotating proxy (e.g. mise run proxy-probe -- <url> -X POST)"
run = "uv run --all-packages --extra dev --env-file .env python -m tests.plugins.probe"
dir = "packages/core"

[tasks.dev-cli]
description = "Run CLI during development (e.g., mise run dev-cli -- extract <url>)"
run = "uv run --all-packages --extra dev megaloader"

[tasks.api-serve]
description = "Run local API server"
run = "env -u VIRTUAL_ENV uv run uvicorn index:app --reload" # Use --host 0.0.0.0 to expose the server on the local network.
dir = "apps/api"

[tasks.docs-serve]
description = "Serve documentation locally"
run = ["bun install --frozen-lockfile", "bun run docs:dev"] # pass '--host' to expose the server in local network
dir = "apps/docs"

[tasks.validate-snippets]
description = "Validate Python code snippets in documentation"
run = "uv run --all-packages --extra dev python scripts/validate-code-snippets.py"

[tasks.generate-logo]
description = "Generate project logo as SVG"
run = "uv run --all-packages --extra dev python scripts/generate-logo.py"

[tasks.build-bin]
description = "Build the CLI binary with PyInstaller"
run = "uv run --locked --package megaloader-cli pyinstaller --onefile --copy-metadata megaloader-cli --name \"{{ get_env(name='PYINSTALLER_NAME', default='megaloader-cli') }}\" --paths packages/core packages/cli/megaloader_cli/main.py"

[tasks.api-deploy]
description = "Deploy API to Vercel"
run = "vercel --prod"
dir = "apps/api"
