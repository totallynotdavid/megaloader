[project]
name = "megaloader-api"
version = "0.1.0"
description = "FastAPI demo for Megaloader core library"
readme = "readme.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" },
]

dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "chardet>=7.6.0", # Prevents uvicorn from warning about the missing dependency.
    "httpx2>=2.13.1",
    "megaloader>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.mypy]
files = ["api", "index.py"]
strict = true
